<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Lab_Simulation_System</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Lab_Simulation_System</div>
      </div>
    </div>
    <script>

      const unityBridgeState = {
        context: getContextFromUrl(),
        pendingMessages: [],
      };

      function getContextFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return {
          scene: params.get('scene') || '',
          token: params.get('token') || '',
          userId: params.get('userId') || '',
          userName: params.get('userName') || '',
          apiBase: params.get('apiBase') || `${window.location.origin}/api`,
        };
      }

      function postToParent(type, payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type, payload }, window.location.origin);
        }
      }

      function normalizeUnityEventPayload(payload) {
        const normalized = payload && typeof payload === 'object' ? payload : {};
        return {
          event: normalized.event || normalized.eventName || 'scene.untyped_event',
          source: normalized.source || 'unity',
          occurredAt: normalized.occurredAt || new Date().toISOString(),
          scene: normalized.scene || unityBridgeState.context.scene || '',
          message: normalized.message || '',
          level: normalized.level || 'info',
          entityId: normalized.entityId || '',
          entityName: normalized.entityName || '',
          requestId: normalized.requestId || '',
        };
      }

      window.SmartLabUnityBridge = {
        emit(eventName, payload) {
          postToParent('unity-event', normalizeUnityEventPayload({
            event: eventName,
            ...(payload || {}),
          }));
        },
        emitRaw(rawJson) {
          try {
            const parsed = JSON.parse(rawJson);
            postToParent('unity-event', normalizeUnityEventPayload(parsed));
          } catch (error) {
            console.error('[UnityBridge] 解析 Unity 事件失败', error, rawJson);
          }
        },
      };

      function forwardToUnity(method, payload) {
        if (!window.unityInstance) {
          unityBridgeState.pendingMessages.push({ method, payload });
          return;
        }

        try {
          window.unityInstance.SendMessage('WebGLBridge', method, JSON.stringify(payload || {}));
        } catch (error) {
          console.error(`[UnityBridge] ${method} 转发失败`, error);
        }
      }

      function flushPendingMessages() {
        if (!window.unityInstance || unityBridgeState.pendingMessages.length === 0) {
          return;
        }

        const queuedMessages = [...unityBridgeState.pendingMessages];
        unityBridgeState.pendingMessages.length = 0;
        queuedMessages.forEach(({ method, payload }) => {
          forwardToUnity(method, payload);
        });
      }

      function syncContext(nextContext) {
        unityBridgeState.context = {
          ...unityBridgeState.context,
          ...(nextContext || {}),
        };
        forwardToUnity('ReceiveWebContext', unityBridgeState.context);
      }

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) {
          return;
        }

        const message = event.data;
        if (!message || typeof message !== 'object') {
          return;
        }

        if (message.type === 'unity-context') {
          syncContext(message.payload);
          return;
        }

        if (message.type === 'unity-realtime-event') {
          forwardToUnity('ReceiveRealtimeEvent', message.payload);
          return;
        }

        if (message.type === 'unity-command') {
          forwardToUnity('ReceiveWebCommand', message.payload);
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/3D_Lab.loader.js";
      var config = {
        dataUrl: buildUrl + "/3D_Lab.data",
        frameworkUrl: buildUrl + "/3D_Lab.framework.js",
        codeUrl: buildUrl + "/3D_Lab.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Lab_Simulation_System",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
                flushPendingMessages();
                syncContext(unityBridgeState.context);
                postToParent('unity-ready', { scene: unityBridgeState.context.scene });
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
      postToParent('unity-request-context', unityBridgeState.context);

    </script>
  </body>
</html>
