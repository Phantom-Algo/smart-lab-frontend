# ============================================================
# RocketMQ 5.3.2 单机开发环境
# 启动: docker compose -f docker/rocketmq.yml up -d
# 停止: docker compose -f docker/rocketmq.yml down
# 数据目录: docker/rocketmq/data/
# 重置: 停止后手动清空 docker/rocketmq/data/ 下对应目录
# Dashboard: http://localhost:8083
# ============================================================

services:
  # ---- NameServer ----
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ./rocketmq/data/namesrv/logs:/home/rocketmq/logs
    networks:
      - rocketmq
    command: sh mqnamesrv

  # ---- Broker ----
  broker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    ports:
      - "10909:10909"   # Broker 内部通信
      - "10911:10911"   # Broker 对外通信（客户端连接）
      - "10912:10912"   # Broker HA
    volumes:
      # 挂载自定义 broker 配置文件
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      # 使用 bind mount 持久化数据，避免 named volume 在 Docker Desktop 下目录归属为 root 导致 Broker 无法写入 store
      - ./rocketmq/data/broker/logs:/home/rocketmq/logs
      - ./rocketmq/data/broker/store:/home/rocketmq/store
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn128m
    depends_on:
      - namesrv
    networks:
      - rocketmq
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf

  # ---- Proxy（gRPC 端口改为 8082，避免与 Spring Boot 8080 冲突）----
  proxy:
    image: apache/rocketmq:5.3.2
    container_name: rmqproxy
    ports:
      - "8082:8080"     # gRPC 端口 → 宿主机 8082
      - "8081:8081"     # HTTP 管理端口
    volumes:
      - ./rocketmq/data/proxy/logs:/home/rocketmq/logs
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-Xms256m -Xmx256m
    depends_on:
      - broker
      - namesrv
    networks:
      - rocketmq
    restart: on-failure
    command: sh mqproxy

  # ---- Dashboard 可视化管理台 ----
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    ports:
      - "8083:8082"
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rmqnamesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    depends_on:
      - namesrv
    networks:
      - rocketmq

# ---- 容器网络 ----
networks:
  rocketmq:
    driver: bridge
