# ============================================================
# RocketMQ Broker 开发环境配置
# 基于镜像自带 broker.conf，仅增加开发环境所需配置
# ============================================================
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# === 以下为开发环境新增配置 ===
# 自动创建 Topic（开发环境开启，避免首次发送报 No route info）
autoCreateTopicEnable = true
# 自动创建订阅组
autoCreateSubscriptionGroup = true
# 开发机 Docker 磁盘占用较高时仍允许本地集成测试写入少量消息
diskMaxUsedSpaceRatio = 95
diskSpaceWarningLevelRatio = 95
diskSpaceCleanForciblyRatio = 95
# 如果某些同学本机无法访问 NameServer 返回的 Broker 地址，可按本机实际情况显式指定宿主机可达地址
# 例如：127.0.0.1 或宿主机局域网 IP。若启用该配置，Dashboard 也必须能访问这个地址。
brokerIP1 = 127.0.0.1
