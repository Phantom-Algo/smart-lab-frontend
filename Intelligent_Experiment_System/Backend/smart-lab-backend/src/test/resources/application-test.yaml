# TEST — H2 内存数据库，禁用 Flyway/RocketMQ
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration

mybatis-plus:
  global-config:
    db-config:
      id-type: auto

equipment:
  device-no-prefix: DEV
  repair-no-prefix: RPR
  apply-no-prefix: APL
  health-score-enabled: false

material:
  material-no-prefix: MTL
  batch-no-prefix: BTC
  apply-no-prefix: MRP
  stock-in-no-prefix: MSI
  near-expiry-days: 30
  over-receive-threshold: 100
