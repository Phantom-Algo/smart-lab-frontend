# ============================================================
# DEV 环境配置
# ============================================================

# ---- 服务端口 ----
server:
  port: 8080

# ---- 日志级别 ----
logging:
  level:
    root: INFO
    com.zhangjintao.project.smart_lab_backend: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

# ---- Spring 核心配置 ----
spring:
  # ----- 数据库连接池 (HikariCP) -----
  datasource:
    url: jdbc:mysql://localhost:3306/smart_lab?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: XKAYQybz!1226
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      pool-name: SmartLabHikariCP

  # ----- Flyway 数据库迁移 -----
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 首次启动时若数据库已有表，开启 baseline 避免报错
    baseline-on-migrate: true
    baseline-version: 1
    # 禁止自动清理（防止误删数据）
    clean-disabled: true
    # 表名编码使用 UTF-8
    table: flyway_schema_history

  # ----- Redis -----
  data:
    redis:
      host: localhost
      port: 6379
      password:                          # 本地开发一般无密码，留空
      database: 0
      timeout: 3000ms
      lettuce:                           # 默认客户端 Lettuce
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ----- Jackson 日期格式 -----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ---- 消息通知与收件箱子系统配置 ----
message:
  inbox:
    dispatcher:
      stream-key: smart_lab:message_inbox:stream
      consumer-group: message-inbox-dispatcher
      consumer-name: smart-lab-backend-dev
      fixed-delay-ms: 3000
      batch-size: 20
      max-retry-count: 3
      claim-idle-ms: 60000
      executor:
        core-pool-size: 1
        max-pool-size: 1
        queue-capacity: 10

smart-lab:
  auth:
    session:
      access-token-ttl-seconds: 7200
      recent-session-limit: 10
    password:
      max-failed-attempts: 5
      lock-duration-minutes: 30
      min-length: 8

  # ---- 物联网环境子系统（sensor_env）配置 ----
  iot:
    # RocketMQ 消息队列配置
    mq:
      topic: iot-sensor-data
      producer-group: iot-sensor-data-producer
      tags:
        lab-sensor-data: lab_sensor_data
        device-sensor-data: device_sensor_data
      consumer-groups:
        lab-sensor-data-consumer: lab-sensor-data-consumer
        device-sensor-data-consumer: device-sensor-data-consumer
    # 传感器管理配置
    sensor:
      status-detection-enabled: false
      offline-threshold: 5m
      offline-scan-fixed-delay: 1m
      offline-scan-batch-size: 200
    # 数据保留配置
    data:
      retention-days: 90

# ---- RocketMQ 基础配置 ----
rocketmq:
  name-server: localhost:9876
  producer:
    group: iot-sensor-data-producer

# ---- MyBatis-Plus 统一配置 ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhangjintao.project.smart_lab_backend.modules.*.dao.dataobject
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---- 智能化设备管理子系统 ----
equipment:
  device-no-prefix: DEV
  repair-no-prefix: RPR
  apply-no-prefix: APL
  health-score-enabled: true
